server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same role as proxy.conf.json in development: the app calls /api on its own origin.
    location /api/ {
        proxy_pass http://backend:8080;
        # $http_host keeps the port, so the backend sees the same origin as the browser's Origin
        # header and doesn't treat the call as cross-origin (which CORS would reject on any
        # FRONTEND_PORT not listed in WebConfig). No X-Forwarded-Proto: Tomcat would then reset
        # the port to 80 and the origins would differ again.
        proxy_set_header Host $http_host;
        # nginx is the entry point, so it overwrites X-Forwarded-For instead of appending to it:
        # a client-sent value would otherwise reach the backend, which trusts this proxy, and
        # let the client pick the IP the rate limit counts against.
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Angular puts a content hash in bundle names, so a given file never changes.
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
