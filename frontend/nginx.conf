server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same role as proxy.conf.json in development: the app calls /api on its own origin.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # nginx is the entry point, so it overwrites X-Forwarded-For instead of appending to it:
        # a client-sent value would otherwise reach the backend, which trusts this proxy, and
        # let the client pick the IP the rate limit counts against.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular puts a content hash in bundle names, so a given file never changes.
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
