services:
  redis:
    image: redis:7-alpine
    container_name: tinylink-redis
    ports:
      # Dev only: Redis has no password, so publish it on loopback only.
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis-commander:
    # No version tags are published; pinned by digest (app version 0.7.2-rc3).
    image: rediscommander/redis-commander@sha256:19cd0c49f418779fa2822a0496c5e6516d0c792effc39ed20089e6268477e40a
    container_name: tinylink-redis-commander
    profiles: ["debug"]
    environment:
      REDIS_HOSTS: tinylink:redis:6379
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: tinylink-backend
    environment:
      SPRING_DATA_REDIS_HOST: redis
      TINYLINK_BASE_URL: http://localhost:${BACKEND_PORT:-8080}
      # Zone used to bucket analytics clicks by hour and day; match the host's.
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: tinylink-frontend
    ports:
      - "${FRONTEND_PORT:-8082}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis-data:
