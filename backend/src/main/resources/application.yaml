spring:
  application:
    name: tinylink
  data:
    redis:
      port: 6379
      host: localhost
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
server:
  port: 8080
  # Tomcat takes the client IP from X-Forwarded-For only when the request comes from a
  # trusted proxy (loopback and private ranges by default), so clients can't spoof it.
  forward-headers-strategy: native

tinylink:
  base-url: http://localhost:8080
  short-code:
    length: 6
    max-attempts: 10
  rate-limit:
    requests-per-minute: 2
    requests-per-hour: 10
  cache:
    ttl-minutes: 30
  cleanup:
    interval-minutes: 1
    expired-urls-batch-size: 100


logging:
  level:
    com.devcordeiro.tinylink: DEBUG
    org.springframework.data.redis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
